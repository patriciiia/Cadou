<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>La mulți ani, Tatiana! 🎂</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- BALLOANELE DIN FUNDAL -->
    <div class="background">

        <div class="balloon b1">🎈</div>
        <div class="balloon b2">🎈</div>
        <div class="balloon b3">🎈</div>
        <div class="balloon b4">🎈</div>
        <div class="balloon b5">🎈</div>
        <div class="balloon b6">🎈</div>

    </div>


    <main class="card">

        <h1 id="intro">
            🎁 Surprizăăă 🎁
        </h1>


        <!-- SCENA -->
        <div class="scene">

            <div class="floor-shadow"></div>


            <!-- CUTIA -->
            <div class="gift" id="gift">

                <!-- INTERIORUL CUTIEI -->
                <div class="inside"></div>

                <!-- CORP CUTIE -->
                <div class="box">

                    <div class="box-front"></div>

                    <!-- PANGICĂ VERTICALĂ -->
                    <div class="ribbon-vertical"></div>

                    <!-- PANGICĂ ORIZONTALĂ -->
                    <div class="ribbon-horizontal"></div>

                </div>


                <!-- CAPAC -->
                <div class="lid">

                    <div class="lid-main"></div>

                    <div class="lid-ribbon"></div>
                    <!-- FUNDĂ -->
                     
                <div class="bow">

                    <div class="bow-left"></div>

                    <div class="bow-right"></div>

                    <div class="bow-center"></div>

                </div>

                </div>


                

            </div>


            <!-- URSULEȚ -->
            <div class="bear" id="bear">

                <div class="ear left-ear"></div>
                <div class="ear right-ear"></div>


                <div class="head">

                    <div class="eye eye-left"></div>
                    <div class="eye eye-right"></div>

                    <div class="muzzle">

                        <div class="nose"></div>

                        <div class="mouth"></div>

                    </div>

                </div>


                <div class="body"></div>


                <!-- TORT -->
                <div class="cake">

                    <div class="cake-top"></div>

                    <div class="cake-body">

                        <div class="cream cream1"></div>
                        <div class="cream cream2"></div>
                        <div class="cream cream3"></div>

                    </div>


                    <div class="candle candle1">
                        <div class="flame"></div>
                    </div>

                    <div class="candle candle2">
                        <div class="flame"></div>
                    </div>

                    <div class="candle candle3">
                        <div class="flame"></div>
                    </div>

                </div>


                <!-- BRAȚELE URSULEȚULUI -->
                <div class="arm arm-left"></div>
                <div class="arm arm-right"></div>

            </div>

        </div>


        <!-- MESAJ -->
        <section class="message" id="message">

            <div class="sparkles">
                ✨ 🎉 ✨
            </div>

            <h2>
                La mulți ani, Tatiana! 💐
            </h2>

        

        </section>


        <!-- BUTON -->
        <button id="openButton">
            🎁 Deschide cadoul
        </button>

    </main>


    <script src="script.js"></script>

</body>
</html>
